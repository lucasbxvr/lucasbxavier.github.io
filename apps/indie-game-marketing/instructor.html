<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="author" content="Lucas B. Xavier">
<title>MKTG 4560 · Instructor console</title>
<style>
:root{--ink:#1d2330;--muted:#5b6475;--line:#e3e6ec;--accent:#0b6e8a;--accent-soft:#e6f3f7;--warn:#a5482a;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:860px;margin:32px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:40px 48px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 .3rem}
h2{font-size:1.2rem;margin:2rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.4rem 0 .4rem}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--accent);font-weight:700}
.meta{color:var(--muted);font-size:.95rem}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);padding:.8rem 1rem;border-radius:4px;margin:1rem 0}
.warn{background:#fbeee9;border-left:4px solid var(--warn);padding:.8rem 1rem;border-radius:4px;margin:1rem 0}
table{border-collapse:collapse;width:100%;margin:.6rem 0 1rem;font-size:.94rem}
th,td{border:1px solid var(--line);padding:.5rem .6rem;vertical-align:top;text-align:left}
th{background:#f1f3f6}
.mod{color:var(--accent);font-weight:600;font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:1rem 0}
.fact{border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem}
.fact b{display:block;font-size:1.25rem}
.fact span{color:var(--muted);font-size:.85rem}
/* reports */
.report{max-width:760px}
.report .brandbar{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);border-bottom:2px solid var(--accent);padding-bottom:.5rem;margin-bottom:1.2rem}
.report .brandbar b{color:var(--accent);letter-spacing:.04em}
.chart{margin:1.2rem 0}
.bar-row{display:grid;grid-template-columns:200px 1fr 64px;align-items:center;gap:10px;margin:7px 0;font-size:.92rem}
.bar-track{background:#eef1f4;border-radius:3px;height:20px}
.bar{background:var(--accent);height:20px;border-radius:3px}
.bar.hl{background:var(--warn)}
.bar-val{font-variant-numeric:tabular-nums;font-weight:600}
.group-label{font-weight:700;margin:14px 0 4px;font-size:.9rem}
.source{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:1.4rem;padding-top:.6rem}
.fictional{display:inline-block;background:#fff4d6;color:#7a5a00;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
.instructor{background:#2b2f3a;color:#fff;padding:.6rem 1rem;border-radius:6px;font-weight:700;margin-bottom:1rem}
code{background:#f1f3f6;padding:1px 5px;border-radius:3px}
@media print{body{background:#fff}.page{border:none;margin:0}}
/* company reports: the client's own dashboards */
.company{--accent:var(--co,#3f6b3a);max-width:820px;padding:0;overflow:hidden}
.company .co-head{background:var(--co,#3f6b3a);color:#fff;padding:18px 40px}
.company .co-head .lbl{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.company .co-head h1{color:#fff;margin:.25rem 0 .1rem}
.company .co-head .sub{opacity:.9}
.company .co-body{padding:24px 40px 32px}
.company .bar{background:var(--co,#3f6b3a)}
.company .bar.hl{background:#c98a1a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:.4rem 0 1.2rem}
.kpi{background:#f4f7f3;border-radius:8px;padding:.8rem 1rem}
.kpi b{display:block;font-size:1.5rem;color:var(--co,#3f6b3a)}
.kpi span{font-size:.84rem;color:var(--muted)}
.attached{border:2px dashed var(--line);border-radius:8px;padding:.8rem 1rem;margin:1rem 0}
.attached a{font-weight:600}
.index-list a{display:block;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;margin:.5rem 0;text-decoration:none;color:var(--ink)}
.index-list a:hover{border-color:var(--accent)}
.index-list b{color:var(--accent)}
/* ---- client branding (brief, brand handout) ---- */
.themed{--accent:var(--b-accent);--accent-soft:var(--b-accent-soft);font-family:var(--b-body),system-ui,sans-serif;background:var(--b-paper,#fff)}
.themed h1,.themed h2,.themed h3{font-family:var(--b-display),Georgia,serif;color:var(--b-dark)}
.themed h2{border-bottom-color:var(--b-accent-soft)}
.themed .kicker{color:var(--b-accent)}
.themed .fact b{color:var(--b-dark)}
.report{--accent:#0b6e8a;--accent-soft:#e6f3f7}
.brief-logo svg{max-width:300px;height:auto;display:block;margin:0 0 10px -6px}
.brand-cover{margin:-40px -48px 24px;border-radius:10px 10px 0 0;overflow:hidden;position:relative}
.brand-cover svg{display:block;width:100%;height:auto}
.brand-cover .cover-logo{position:absolute;left:28px;bottom:18px;background:var(--b-paper,#fff);border-radius:14px;padding:8px 14px 2px}
.brand-cover .cover-logo svg{width:260px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:.6rem 0 1rem}
.swatch{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.86rem}
.swatch .chip-c{height:64px}
.swatch div:last-child{padding:.5rem .7rem}
.swatch b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
.box.yes{border-top:4px solid var(--b-accent)}
.box.no{border-top:4px solid #9aa1ad}
.lines p{font-family:var(--b-display),Georgia,serif;font-size:1.25rem;margin:.35rem 0;color:var(--b-dark)}
.type-sample{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0}
.type-sample .big{font-size:2rem;line-height:1.2;color:var(--b-dark)}
.screens{display:flex;gap:14px;flex-wrap:wrap}
.screens figure{margin:0;width:180px}
.screens svg{width:180px;height:auto}
.screens figcaption{font-size:.84rem;color:var(--muted)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:10px;padding:.7rem;text-align:center;font-size:.88rem}
.asset .thumb{height:110px;display:flex;align-items:center;justify-content:center}
.asset .thumb svg{max-height:110px;max-width:100%;width:auto;height:auto}
.asset button,.asset a.btn{margin:.3rem .15rem 0;padding:.3rem .6rem;font-size:.8rem;border-radius:5px;background:var(--b-accent,#0b6e8a);color:#fff;border:none;text-decoration:none;display:inline-block;cursor:pointer}
.box svg,.themed svg{max-width:100%;height:auto}

body{background:#eef1f5}
#login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px}
#login input{width:100%;padding:.6rem;border:1px solid #c9ced8;border-radius:6px;font:inherit;margin-top:.4rem}
button{font:inherit;cursor:pointer;border:none;border-radius:6px;padding:.5rem .9rem;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.danger{background:#a5482a}
#login button{width:100%;margin-top:1rem}
.err{color:var(--warn);font-weight:600;margin-top:.8rem;min-height:1.2em}
#app{display:none;height:100vh;grid-template-rows:auto 1fr}
header.top{display:flex;align-items:center;gap:12px;background:#2b2f3a;color:#fff;padding:10px 18px}
header.top .who{font-weight:700}
header.top .dirty{margin-left:auto;background:#a5482a;padding:3px 10px;border-radius:12px;font-size:.85rem;display:none}
header.top button{background:#ffffff22;font-size:.88rem;padding:.35rem .8rem}
.main{display:grid;grid-template-columns:250px 1fr;min-height:0}
nav.side{background:#fff;border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
nav.side .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 8px 6px;font-weight:700}
nav.side a{display:block;padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.9rem}
nav.side a.sub{padding-left:22px;font-size:.86rem;color:var(--muted)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#content{overflow:auto;padding:0 18px 40px}
#content .page{margin:22px auto}
.stale{background:#fff4d6;border-left:4px solid #c9a227;padding:.6rem 1rem;border-radius:4px;margin:16px auto 0;max-width:860px;font-size:.9rem}
.form label{display:block;font-weight:600;margin:.9rem 0 .25rem}
.form input[type=text],.form input[type=password],.form select,.form textarea{width:100%;padding:.5rem;border:1px solid #c9ced8;border-radius:6px;font:inherit}
.form textarea{min-height:70px}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:65vh;width:100%;padding:.6rem;border:1px solid #c9ced8;border-radius:6px}
.intent{border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;margin:.8rem 0}
.intent.hidden{border-left:5px solid #a5482a}
.intent .row{display:flex;gap:10px;align-items:center}
.intent .row b{font-family:ui-monospace,monospace}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.6rem 0}
.ok{color:#2f7d32;font-weight:600}
</style></head><body>
<div id="login"><div class="kicker">MKTG 4560 · Assignment 5</div><h1>Instructor console</h1>
<p class="meta">Everything in the simulator, including answer keys and hidden topics.</p>
<label for="pw"><b>Admin password</b></label><input id="pw" type="password" autocomplete="off">
<button id="go">Open</button><div class="err" id="err"></div></div>
<div id="app">
  <header class="top"><span class="who">Instructor console · Assignment 5</span><span class="dirty" id="dirty">Unsaved edits</span>
    <button id="export">Download sources</button><button id="out">Log out</button></header>
  <div class="main"><nav class="side" id="nav"></nav><section id="content"></section></div>
</div>

let D = null, SRC = null, view = "overview", DIRTY = false;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function decrypt(pw){
  const enc = new TextEncoder(), sub = crypto.subtle;
  const base = await sub.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await sub.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(ENC.salt), iterations:ENC.iter}, base, 512));
  const nonce = b64(ENC.nonce), ct = b64(ENC.ct), tag = b64(ENC.tag);
  const km = await sub.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  const signed = new Uint8Array(nonce.length + ct.length); signed.set(nonce); signed.set(ct, nonce.length);
  if (!await sub.verify("HMAC", km, tag, signed)) return null;
  const ke = await sub.importKey("raw", bits.slice(0,32), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const n = Math.ceil(ct.length / 32), jobs = [];
  for (let i = 0; i < n; i++){ const blk = new Uint8Array(nonce.length + 4); blk.set(nonce); new DataView(blk.buffer).setUint32(nonce.length, i); jobs.push(sub.sign("HMAC", ke, blk)); }
  const ks = await Promise.all(jobs), pt = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) pt[i] = ct[i] ^ new Uint8Array(ks[i >> 5])[i & 31];
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate"))).text());
}
async function login(){
  $("err").textContent = ""; $("go").disabled = true;
  try {
    const d = await decrypt($("pw").value);
    if (!d){ $("err").textContent = "That password isn't right."; return; }
    D = d; SRC = structuredClone(d.sources);
    const draft = store.get("a5-admin-draft");
    if (draft && draft.builtAt === D.builtAt && confirm("You have unsaved edits from " + new Date(draft.savedAt).toLocaleString() + ". Restore them?")){ SRC = draft.src; markDirty(); }
    start();
  } catch(e){ console.error(e); $("err").textContent = "This browser couldn't open the console."; }
  finally { $("go").disabled = false; }
}
$("go").onclick = login; $("pw").onkeydown = e => { if (e.key === "Enter") login(); };

function start(){
  $("login").style.display = "none"; $("app").style.display = "grid";
  document.head.insertAdjacentHTML("beforeend", `<style>${D.fontCss}</style>`);
  buildNav(); show("overview");
}
const P = id => SRC.products[id];
function buildNav(){
  let h = `<a data-v="overview">Overview</a><a data-v="settings">Passwords and groups</a><a data-v="export">Publish changes</a>`;
  for (const id of D.order){
    const p = P(id), r = D.rendered[id];
    h += `<div class="grp">${esc(p.name)}</div><a data-v="${id}|brief">Brief</a>`;
    r.company.forEach(c => h += `<a class="sub" data-v="${id}|co|${c.id}">${esc(c.id)} · ${esc(c.title)}</a>`);
    if (r.brandPage) h += `<a data-v="${id}|brand">Brand handout</a>`;
    h += `<a data-v="${id}|script">Client answer sheet (edit)</a><a data-v="${id}|key">Answer key</a><a data-v="${id}|json">Edit all content (JSON)</a><a data-v="${id}|student">Open as student</a>`;
  }
  h += `<div class="grp">Industry reports</div><a data-v="ind">All reports</a>`;
  D.industry.forEach(r => h += `<a class="sub" data-v="ind|${r.id}">${esc(r.id)} · ${esc(r.title)}</a>`);
  h += `<a data-v="map">Which report serves which game</a><a data-v="indjson">Edit industry reports (JSON)</a>`;
  h += `<div class="grp">Shared and course</div><a data-v="common">Shared example questions (JSON)</a><a data-v="desc">Assignment description</a><a data-v="rubric">Rubric</a>`;
  $("nav").innerHTML = h;
}
document.addEventListener("click", e => { const a = e.target.closest("[data-v]"); if (a){ e.preventDefault(); show(a.dataset.v); } });
const STALE = `<div class="stale">You have unsaved edits. This preview shows the version last published; it updates after you publish your changes.</div>`;
function setHTML(h, stale){ $("content").innerHTML = (stale && DIRTY ? STALE : "") + h; $("content").scrollTop = 0; }
function show(v){
  view = v; document.querySelectorAll("nav.side a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  const [a, b, c] = v.split("|");
  if (v === "overview") return overview();
  if (v === "settings") return settings();
  if (v === "export") return exportView();
  if (v === "ind") return setHTML(D.industryIndex, true);
  if (a === "ind") return setHTML(D.industry.find(r => r.id === b).html, true);
  if (v === "map") return setHTML(`<div class="page" style="max-width:1200px">${D.map}</div>`, true);
  if (v === "indjson") return jsonEditor("Industry reports", () => SRC.industry, x => SRC.industry = x);
  if (v === "common") return jsonEditor("Shared example questions (every client understands these)", () => SRC.common, x => SRC.common = x);
  if (v === "desc") return setHTML(`<div class="page">${D.docs.description}</div>`);
  if (v === "rubric") return setHTML(`<div class="page" style="max-width:1100px">${D.docs.rubric}</div>`);
  const r = D.rendered[a];
  if (b === "brief") return setHTML(r.brief, true);
  if (b === "brand") return setHTML(r.brandPage, true);
  if (b === "co") return setHTML(r.company.find(x => x.id === c).html, true);
  if (b === "key") return setHTML(`<div class="page">${r.key}</div>`, true);
  if (b === "script") return scriptEditor(a);
  if (b === "json") return jsonEditor(P(a).name + ": all content", () => P(a), x => SRC.products[a] = x);
  if (b === "student") return studentView(a);
}

// ---- overview ----
function overview(){
  const groups = Object.entries(SRC.groups).filter(([k]) => !k.startsWith("_"));
  let rows = D.order.map(id => { const p = P(id), cs = p.client_script.intents;
    const gs = groups.filter(([, g]) => g === id).map(([n]) => n).join(", ") || "—";
    return `<tr><td><b>${esc(p.name)}</b><br><span class="meta">${esc(p.studio)}</span></td><td>${esc(gs)}</td><td>${esc(p.client.name)}</td><td>${cs.length} (${cs.filter(i => i.hidden).length} hidden)</td>
      <td>${esc(p.answer_key.ideal)}<br><span class="meta"><b>Trap:</b> ${esc(p.answer_key.trap)}</span></td></tr>`; }).join("");
  setHTML(`<div class="page" style="max-width:1150px"><div class="kicker">Instructor console</div><h1>Overview</h1>
  <p class="meta">Published ${new Date(D.builtAt).toLocaleString()} · ${groups.length} groups · student password: <code>${esc(SRC.settings.student_password)}</code></p>
  <table><tr><th>Game</th><th>Groups</th><th>Client</th><th>Topics</th><th>Ideal answer and trap</th></tr>${rows}</table>
  <h3>How students' chats are stored</h3><p class="meta">The simulator keeps each group's chat in that group's browser only; nothing is sent anywhere, so it can't be viewed here. Groups can download their chat for their appendix.</p></div>`);
}

// ---- settings ----
function settings(){
  const groups = Object.entries(SRC.groups).filter(([k]) => !k.startsWith("_")).sort((x, y) => +x[0] - +y[0]);
  const opts = g => D.order.map(id => `<option value="${id}" ${g === id ? "selected" : ""}>${esc(P(id).name)}</option>`).join("");
  setHTML(`<div class="page form"><div class="kicker">Settings</div><h1>Passwords and groups</h1>
  <label>Student password (given out in class)</label><input type="text" id="s-stu" value="${esc(SRC.settings.student_password)}">
  <label>Admin password (this console)</label><input type="password" id="s-adm" value="${esc(SRC.settings.admin_password)}">
  <div class="inline"><label style="margin:0;font-weight:400"><input type="checkbox" id="s-show"> Show admin password</label></div>
  <p class="meta">Use a long passphrase for the admin password: the console is public, protected only by encryption.</p>
  <h2>Groups</h2><table id="g-table"><tr><th>Group</th><th>Game</th></tr>${groups.map(([n, g]) => `<tr><td>Group ${esc(n)}</td><td><select data-g="${esc(n)}">${opts(g)}</select></td></tr>`).join("")}</table>
  <div class="inline"><button class="ghost" id="g-add">Add a group</button><button class="ghost" id="g-del">Remove the last group</button></div>
  <div class="inline"><button id="s-save">Apply</button><span id="s-msg"></span></div></div>`);
  $("s-show").onchange = e => $("s-adm").type = e.target.checked ? "text" : "password";
  $("g-add").onclick = () => { const n = groups.length + 1; SRC.groups[String(n)] = D.order[0]; markDirty(); settings(); };
  $("g-del").onclick = () => { if (groups.length > 1){ delete SRC.groups[String(groups.length)]; markDirty(); settings(); } };
  $("s-save").onclick = () => {
    const stu = $("s-stu").value.trim(), adm = $("s-adm").value.trim();
    if (stu.length < 4 || adm.length < 8){ $("s-msg").innerHTML = `<span class="err">Student password: 4+ characters. Admin password: 8+.</span>`; return; }
    SRC.settings.student_password = stu; SRC.settings.admin_password = adm;
    document.querySelectorAll("select[data-g]").forEach(s => SRC.groups[s.dataset.g] = s.value);
    markDirty(); $("s-msg").innerHTML = `<span class="ok">Applied. Publish your changes to make them live.</span>`;
  };
}

// ---- client answer sheet editor ----
function scriptEditor(id){
  const cs = P(id).client_script;
  const card = (it, i) => `<div class="intent ${it.hidden ? "hidden" : ""}" data-i="${i}"><div class="row"><b>${esc(it.id)}</b>
    <label><input type="checkbox" data-f="hidden" ${it.hidden ? "checked" : ""}> Hidden (not in brief or reports)</label>
    <span style="margin-left:auto"></span><button class="danger" data-del="${i}">Delete</button></div>
    <label>Suggestion button text</label><input type="text" data-f="label" value="${esc(it.label || "")}">
    <label>Answer</label><textarea data-f="answer">${esc(it.answer)}</textarea>
    <label>Example questions (one per line) — how the meaning model recognises this topic</label><textarea data-f="examples">${esc((it.examples || []).join("\n"))}</textarea>
    <label>Keywords (comma-separated) — backup if the model can't load</label><input type="text" data-f="keywords" value="${esc((it.keywords || []).join(", "))}">
    ${it.common ? `<p class="meta">Also uses the shared examples for “${esc(it.common)}”.</p>` : (SRC.common[it.id] ? `<p class="meta">Also uses the shared examples for “${esc(it.id)}”.</p>` : "")}</div>`;
  setHTML(`<div class="page form" style="max-width:980px"><div class="kicker">${esc(P(id).name)} · ${esc(P(id).client.name)}</div><h1>Client answer sheet</h1>
  <p class="meta">Edit what the client says and how each topic is recognised. Changes apply when you click Apply, and go live when you publish.</p>
  <label>Opening message</label><textarea id="c-greet">${esc(cs.greeting)}</textarea>
  <label>When unsure (shown above the suggestion buttons)</label><input type="text" id="c-unsure" value="${esc(cs.unsure || "")}">
  <label>Fallback replies (one per line)</label><textarea id="c-fb">${esc(cs.fallback.join("\n"))}</textarea>
  <h2>Topics (${cs.intents.length})</h2><div id="c-list">${cs.intents.map(card).join("")}</div>
  <div class="inline"><button class="ghost" id="c-add">Add a topic</button><button id="c-save">Apply</button><span id="c-msg"></span></div></div>`, true);
  $("c-list").onclick = e => { const d = e.target.closest("[data-del]"); if (d && confirm("Delete this topic?")){ collect(); cs.intents.splice(+d.dataset.del, 1); markDirty(); scriptEditor(id); } };
  $("c-add").onclick = () => { const nid = prompt("Short id for the new topic (letters, no spaces):"); if (!nid) return; collect();
    cs.intents.push({id: nid.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "_"), label: "", keywords: [], examples: [], answer: ""}); markDirty(); scriptEditor(id); };
  function collect(){
    cs.greeting = $("c-greet").value; cs.unsure = $("c-unsure").value; cs.fallback = $("c-fb").value.split("\n").map(x => x.trim()).filter(Boolean);
    document.querySelectorAll(".intent").forEach(div => { const it = cs.intents[+div.dataset.i];
      it.label = div.querySelector('[data-f=label]').value.trim(); it.answer = div.querySelector('[data-f=answer]').value.trim();
      it.examples = div.querySelector('[data-f=examples]').value.split("\n").map(x => x.trim()).filter(Boolean);
      it.keywords = div.querySelector('[data-f=keywords]').value.split(",").map(x => x.trim()).filter(Boolean);
      if (div.querySelector('[data-f=hidden]').checked) it.hidden = true; else delete it.hidden; });
  }
  $("c-save").onclick = () => { collect(); markDirty(); $("c-msg").innerHTML = `<span class="ok">Applied. Publish to make it live.</span>`; };
}

// ---- JSON editor ----
function jsonEditor(title, get, put){
  setHTML(`<div class="page form" style="max-width:1100px"><div class="kicker">Edit content</div><h1>${esc(title)}</h1>
  <p class="meta">Everything about this item, as JSON: brief, reports, brand text, client answers, answer key. Keep the structure; change the text and numbers.</p>
  <textarea class="json" id="j-text" spellcheck="false">${esc(JSON.stringify(get(), null, 2))}</textarea>
  <div class="inline"><button id="j-save">Apply</button><button class="ghost" id="j-reset">Discard changes here</button><span id="j-msg"></span></div></div>`);
  $("j-save").onclick = () => { try { put(JSON.parse($("j-text").value)); markDirty(); $("j-msg").innerHTML = `<span class="ok">Applied. Publish to make it live.</span>`; }
    catch(e){ $("j-msg").innerHTML = `<span class="err">Not valid JSON: ${esc(e.message)}</span>`; } };
  $("j-reset").onclick = () => show(view);
}

// ---- student view ----
function studentView(id){
  const groups = Object.entries(SRC.groups).filter(([k, g]) => !k.startsWith("_") && g === id).map(([n]) => n);
  setHTML(`<div class="page form"><div class="kicker">${esc(P(id).name)}</div><h1>Open as student</h1>
  <p>Opens the student simulator in a new tab, logged in as one of this game's groups, in test mode (shows which topic matched each answer). It uses the published version and the published student password.</p>
  <label>Group</label><select id="sv-g">${(groups.length ? groups : Object.keys(SRC.groups).filter(k => !k.startsWith("_"))).map(n => `<option>${esc(n)}</option>`).join("")}</select>
  <div class="inline"><button id="sv-go">Open the simulator</button></div></div>`);
  $("sv-go").onclick = () => { store.set("a5-auth", {pw: D.sources.settings.student_password, group: $("sv-g").value}); window.open("index.html?test", "_blank"); };
}

// ---- publish ----
function exportView(){
  setHTML(`<div class="page"><div class="kicker">Publish changes</div><h1>Publish your edits</h1>
  <p>This page can't save to the website by itself, because the site is static. Publishing takes three steps:</p>
  <ol><li><b>Download sources</b> (button below or top right): one file, <code>a5-sources.json</code>, with every edit you made.</li>
  <li>Rebuild: <code>python3 tools/build.py --import a5-sources.json</code> in the Assignment 5 folder. It updates the source files and rebuilds both pages with the new passwords.</li>
  <li>Upload the rebuilt <code>index.html</code> and <code>instructor.html</code> to the website.</li></ol>
  <div class="warn"><b>Keep a5-sources.json private.</b> It contains both passwords and every answer, unencrypted. Don't commit it to a public repository; delete it after rebuilding.</div>
  <div class="inline"><button id="x-dl">Download sources</button><button class="ghost" id="x-discard">Discard all unsaved edits</button></div></div>`);
  $("x-dl").onclick = download;
  $("x-discard").onclick = () => { if (confirm("Discard every unsaved edit?")){ SRC = structuredClone(D.sources); DIRTY = false; store.del("a5-admin-draft"); $("dirty").style.display = "none"; show("overview"); } };
}
function download(){
  const blob = new Blob([JSON.stringify(SRC, null, 2)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "a5-sources.json"; a.click();
}
$("export").onclick = download;
function markDirty(){ DIRTY = true; $("dirty").style.display = "inline-block"; store.set("a5-admin-draft", {builtAt: D.builtAt, savedAt: Date.now(), src: SRC}); }
$("out").onclick = () => location.reload();
window.addEventListener("beforeunload", e => { if (DIRTY){ e.preventDefault(); e.returnValue = ""; } });
</script></body></html>
