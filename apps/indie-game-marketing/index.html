<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>MKTG 4560 · Agency Simulator</title>
<style>
:root{--ink:#1d2330;--muted:#5b6475;--line:#e3e6ec;--accent:#0b6e8a;--accent-soft:#e6f3f7;--warn:#a5482a;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:860px;margin:32px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:40px 48px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 .3rem}
h2{font-size:1.2rem;margin:2rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.4rem 0 .4rem}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--accent);font-weight:700}
.meta{color:var(--muted);font-size:.95rem}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);padding:.8rem 1rem;border-radius:4px;margin:1rem 0}
.warn{background:#fbeee9;border-left:4px solid var(--warn);padding:.8rem 1rem;border-radius:4px;margin:1rem 0}
table{border-collapse:collapse;width:100%;margin:.6rem 0 1rem;font-size:.94rem}
th,td{border:1px solid var(--line);padding:.5rem .6rem;vertical-align:top;text-align:left}
th{background:#f1f3f6}
.mod{color:var(--accent);font-weight:600;font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:1rem 0}
.fact{border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem}
.fact b{display:block;font-size:1.25rem}
.fact span{color:var(--muted);font-size:.85rem}
/* reports */
.report{max-width:760px}
.report .brandbar{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);border-bottom:2px solid var(--accent);padding-bottom:.5rem;margin-bottom:1.2rem}
.report .brandbar b{color:var(--accent);letter-spacing:.04em}
.chart{margin:1.2rem 0}
.bar-row{display:grid;grid-template-columns:200px 1fr 64px;align-items:center;gap:10px;margin:7px 0;font-size:.92rem}
.bar-track{background:#eef1f4;border-radius:3px;height:20px}
.bar{background:var(--accent);height:20px;border-radius:3px}
.bar.hl{background:var(--warn)}
.bar-val{font-variant-numeric:tabular-nums;font-weight:600}
.group-label{font-weight:700;margin:14px 0 4px;font-size:.9rem}
.source{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:1.4rem;padding-top:.6rem}
.fictional{display:inline-block;background:#fff4d6;color:#7a5a00;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
.instructor{background:#2b2f3a;color:#fff;padding:.6rem 1rem;border-radius:6px;font-weight:700;margin-bottom:1rem}
code{background:#f1f3f6;padding:1px 5px;border-radius:3px}
@media print{body{background:#fff}.page{border:none;margin:0}}
/* company reports: the client's own dashboards */
.company{--accent:var(--co,#3f6b3a);max-width:820px;padding:0;overflow:hidden}
.company .co-head{background:var(--co,#3f6b3a);color:#fff;padding:18px 40px}
.company .co-head .lbl{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.company .co-head h1{color:#fff;margin:.25rem 0 .1rem}
.company .co-head .sub{opacity:.9}
.company .co-body{padding:24px 40px 32px}
.company .bar{background:var(--co,#3f6b3a)}
.company .bar.hl{background:#c98a1a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:.4rem 0 1.2rem}
.kpi{background:#f4f7f3;border-radius:8px;padding:.8rem 1rem}
.kpi b{display:block;font-size:1.5rem;color:var(--co,#3f6b3a)}
.kpi span{font-size:.84rem;color:var(--muted)}
.attached{border:2px dashed var(--line);border-radius:8px;padding:.8rem 1rem;margin:1rem 0}
.attached a{font-weight:600}
.index-list a{display:block;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;margin:.5rem 0;text-decoration:none;color:var(--ink)}
.index-list a:hover{border-color:var(--accent)}
.index-list b{color:var(--accent)}
/* ---- client branding (brief, brand handout) ---- */
.themed{--accent:var(--b-accent);--accent-soft:var(--b-accent-soft);font-family:var(--b-body),system-ui,sans-serif;background:var(--b-paper,#fff)}
.themed h1,.themed h2,.themed h3{font-family:var(--b-display),Georgia,serif;color:var(--b-dark)}
.themed h2{border-bottom-color:var(--b-accent-soft)}
.themed .kicker{color:var(--b-accent)}
.themed .fact b{color:var(--b-dark)}
.report{--accent:#0b6e8a;--accent-soft:#e6f3f7}
.brief-logo svg{max-width:300px;height:auto;display:block;margin:0 0 10px -6px}
.brand-cover{margin:-40px -48px 24px;border-radius:10px 10px 0 0;overflow:hidden;position:relative}
.brand-cover svg{display:block;width:100%;height:auto}
.brand-cover .cover-logo{position:absolute;left:28px;bottom:18px;background:var(--b-paper,#fff);border-radius:14px;padding:8px 14px 2px}
.brand-cover .cover-logo svg{width:260px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:.6rem 0 1rem}
.swatch{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.86rem}
.swatch .chip-c{height:64px}
.swatch div:last-child{padding:.5rem .7rem}
.swatch b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
.box.yes{border-top:4px solid var(--b-accent)}
.box.no{border-top:4px solid #9aa1ad}
.lines p{font-family:var(--b-display),Georgia,serif;font-size:1.25rem;margin:.35rem 0;color:var(--b-dark)}
.type-sample{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0}
.type-sample .big{font-size:2rem;line-height:1.2;color:var(--b-dark)}
.screens{display:flex;gap:14px;flex-wrap:wrap}
.screens figure{margin:0;width:180px}
.screens svg{width:180px;height:auto}
.screens figcaption{font-size:.84rem;color:var(--muted)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:10px;padding:.7rem;text-align:center;font-size:.88rem}
.asset .thumb{height:110px;display:flex;align-items:center;justify-content:center}
.asset .thumb svg{max-height:110px;max-width:100%;width:auto;height:auto}
.asset button,.asset a.btn{margin:.3rem .15rem 0;padding:.3rem .6rem;font-size:.8rem;border-radius:5px;background:var(--b-accent,#0b6e8a);color:#fff;border:none;text-decoration:none;display:inline-block;cursor:pointer}
.box svg,.themed svg{max-width:100%;height:auto}
/* ---- the task, studio profile, data pack ---- */
.lead{font-size:1.12rem}
.scroll{overflow-x:auto}
.nowrap{white-space:nowrap}
table.task td:first-child{min-width:150px}
table.blank td{height:2.1em}
.tree{border:1px solid var(--line);border-radius:10px;padding:14px;margin:1rem 0;text-align:center;font-size:.9rem}
.tree-goal{background:var(--accent);color:#fff;font-weight:700;border-radius:8px;padding:.6rem;margin:0 auto 12px;max-width:520px}
.tree-branches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tree-branches div{background:var(--accent-soft);border-radius:8px;padding:.55rem;font-weight:700;color:var(--accent)}
.tree-branches span{font-weight:400;font-size:.82rem;color:var(--muted)}
.tree-leaves{color:var(--muted);border-top:2px dashed var(--line);padding-top:10px}
.sidenote{background:#f1f3f6;border-radius:8px;padding:.6rem .9rem;font-size:.9rem;color:var(--muted);margin-bottom:1rem}
.box p{margin:.3rem 0 0}
.databar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f1f3f6;border-radius:8px;padding:.45rem .7rem;margin:.6rem 0 1rem;font-size:.88rem;color:var(--muted)}
.databar span{margin-right:auto}
.dl-data{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:none;border-radius:5px;padding:.3rem .7rem;margin:.1rem .15rem;background:var(--accent);color:#fff}
.dataset{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:.7rem 0}
.dataset p{margin:.35rem 0}
.ds-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dataset summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
@media (max-width:640px){.page{padding:24px 18px}.two,.tree-branches{grid-template-columns:1fr}.brand-cover{margin:-24px -18px 18px}}

/* ---- simulator ---- */
body{background:#eef1f5}
#login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px}
#login h1{font-size:1.4rem}
#login label{display:block;font-weight:600;margin:1rem 0 .3rem}
#login input,#login select{width:100%;padding:.6rem;border:1px solid #c9ced8;border-radius:6px;font:inherit}
button{font:inherit;cursor:pointer;border:none;border-radius:6px;padding:.55rem 1rem;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.5;cursor:default}
#login button{width:100%;margin-top:1.2rem;padding:.7rem}
.err{color:var(--warn);font-weight:600;margin-top:.8rem;min-height:1.2em}
#app{display:none;height:100vh;grid-template-rows:auto 1fr}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#1d2330;color:#fff;padding:10px 18px}
header.top .who{font-weight:700}
header.top button{background:#ffffff22;padding:.35rem .8rem;font-size:.88rem}
.main{display:grid;grid-template-columns:200px 1fr 400px;min-height:0}
nav.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav.side .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 8px 6px;font-weight:700}
nav.side a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.93rem}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.side a:hover{background:#f3f5f8}
#content{overflow:auto;padding:0 18px}
#content .page{margin:22px auto}
aside.chat{display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);min-height:0}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-head b{display:block}
.chat-head span{font-size:.85rem;color:var(--muted)}
#msgs{flex:1;overflow:auto;padding:14px 14px 4px}
.msg{max-width:88%;padding:.55rem .8rem;border-radius:12px;margin:0 0 10px;font-size:.94rem;white-space:pre-wrap}
.msg.client{background:#f1f3f6;border-bottom-left-radius:3px}
.msg.agency{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.msg.event{background:#fbeee9;border:1px solid var(--warn);max-width:100%}
.msg .t{display:block;font-size:.72rem;opacity:.65;margin-top:3px}
.msg .dbg{display:block;font-size:.72rem;color:#7a5a00;margin-top:3px}
.typing{color:var(--muted);font-size:.85rem;padding:0 16px 6px;min-height:1.3em}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:62px;padding:.5rem;border:1px solid #c9ced8;border-radius:6px;font:inherit}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chip{background:#fff;color:var(--accent);border:1px solid var(--accent);text-align:left;font-weight:500;padding:.4rem .7rem;font-size:.9rem}
.chip:hover{background:var(--accent-soft)}
#testbar{display:none;background:#fff4d6;padding:6px 18px;font-size:.88rem;gap:8px;align-items:center;flex-wrap:wrap}
#testbar button{background:#7a5a00;padding:.25rem .7rem;font-size:.82rem}
#app.branded header.top{background:var(--b-dark)}
#app.branded .chat-head b{font-family:var(--b-display),Georgia,serif;font-size:1.05rem}
.hicon svg,.cicon svg{width:28px;height:28px;vertical-align:middle;margin-right:8px;border-radius:7px}
.cicon{float:left}.cicon svg{width:38px;height:38px;margin:2px 10px 0 0}
#app.branded .msg.client{background:var(--b-paper);border:1px solid var(--accent-soft)}
@media (max-width:1100px){.main{grid-template-columns:1fr}nav.side{display:flex;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line)}nav.side .grp{width:100%}aside.chat{height:70vh;border-left:none;border-top:1px solid var(--line)}#app{height:auto}}
@media print{header.top,nav.side,aside.chat,#testbar{display:none!important}.main{display:block}#content{overflow:visible}}
</style></head><body>

<div id="login">
  <div class="kicker">MKTG 4560 · Assignment 5</div>
  <h1>Agency simulator</h1>
  <p class="meta">Enter the password from class and your group number.</p>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="off">
  <label for="grp">Group</label><select id="grp"></select>
  <button id="go">Open my client's brief</button>
  <div class="err" id="err"></div>
  <p class="meta" style="margin-top:1.4rem;font-size:.75rem;opacity:.75">© 2026 <a href="https://lucasbxavier.com/apps/indie-game-marketing.html" target="_blank" rel="noopener" style="color:inherit">Lucas B. Xavier</a> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener license" style="color:inherit">CC BY-NC-SA 4.0</a> · <a href="instructor.html" style="color:inherit">Instructor</a></p>
</div>

<div id="app">
  <header class="top"><span class="who" id="who"></span><span style="margin-left:auto"></span>
    <button id="print">Print brief</button><button id="dl">Download chat</button><button id="out">Log out</button></header>
  <div id="testbar"><b>TEST MODE</b> <button id="t-reset">Reset this group</button><span>Matched topics are shown under each client reply.</span></div>
  <div class="main">
    <nav class="side" id="nav"></nav>
    <section id="content"></section>
    <aside class="chat">
      <div class="chat-head"><b id="cname"></b><span id="ctitle"></span></div>
      <div id="msgs"></div><div class="typing" id="typing"></div>
      <div class="composer"><textarea id="q" placeholder="Ask your client a question… (Enter to send)"></textarea><button id="send">Send</button></div>
    </aside>
  </div>
</div>

let DATA = null, G = null, P = null, S = null, view = "brief";
const $ = id => document.getElementById(id);
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

for (let i = 1; i <= ENC.groups; i++) $("grp").insertAdjacentHTML("beforeend", `<option value="${i}">Group ${i}</option>`);

async function decrypt(pw){
  const enc = new TextEncoder(), sub = crypto.subtle;
  const base = await sub.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await sub.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(ENC.salt), iterations:ENC.iter}, base, 512));
  const nonce = b64(ENC.nonce), ct = b64(ENC.ct), tag = b64(ENC.tag);
  const km = await sub.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  const signed = new Uint8Array(nonce.length + ct.length); signed.set(nonce); signed.set(ct, nonce.length);
  if (!await sub.verify("HMAC", km, tag, signed)) return null;
  const ke = await sub.importKey("raw", bits.slice(0,32), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const n = Math.ceil(ct.length / 32), jobs = [];
  for (let i = 0; i < n; i++){ const blk = new Uint8Array(nonce.length + 4); blk.set(nonce); new DataView(blk.buffer).setUint32(nonce.length, i); jobs.push(sub.sign("HMAC", ke, blk)); }
  const ks = await Promise.all(jobs), pt = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) pt[i] = ct[i] ^ new Uint8Array(ks[i >> 5])[i & 31];
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

async function login(pw, group){
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Opening…";
  try {
    const d = await decrypt(pw);
    if (!d){ $("err").textContent = "That password isn't right."; return; }
    DATA = d; G = String(group); store.set("a5-auth", {pw, group:G}); start();
  } catch(e){ $("err").textContent = "This browser couldn't open the simulator. Try an up-to-date Chrome, Edge, Firefox or Safari."; console.error(e); }
  finally { $("go").disabled = false; $("go").textContent = "Open my client's brief"; }
}
$("go").onclick = () => login($("pw").value, $("grp").value);
$("pw").onkeydown = e => { if (e.key === "Enter") login($("pw").value, $("grp").value); };

function start(){
  P = DATA.products[DATA.groups[G]];
  const key = "a5-session-" + G + "-" + P.id;
  S = store.get(key) || {msgs: [], asked: {}, fb: 0};
  S.key = key;
  $("login").style.display = "none"; $("app").style.display = "grid";
  $("who").textContent = `Group ${G} · ${P.name} · ${P.studio}`;
  $("cname").textContent = P.client.name; $("ctitle").textContent = P.client.title;
  if (TEST) $("testbar").style.display = "flex";
  applyTheme();
  buildNav(); show("brief");
  $("msgs").innerHTML = "";
  if (!S.msgs.length) push("client", P.script.greeting); else S.msgs.forEach(render);
  loadModel();
}

function applyTheme(){
  if (P.fontCss) document.head.insertAdjacentHTML("beforeend", `<style>${P.fontCss}</style>`);
  const t = P.theme; if (!t) return;
  const app = $("app");
  app.classList.add("branded");
  app.style.setProperty("--accent", t.accent); app.style.setProperty("--accent-soft", t.accent_soft);
  app.style.setProperty("--b-dark", t.dark); app.style.setProperty("--b-paper", t.paper);
  app.style.setProperty("--b-display", `'${t.display}'`); app.style.setProperty("--b-body", `'${t.body}'`);
  if (P.icon){ $("who").insertAdjacentHTML("afterbegin", `<span class="hicon">${P.icon}</span>`); document.querySelector(".chat-head").insertAdjacentHTML("afterbegin", `<span class="cicon">${P.icon}</span>`); }
}
function buildNav(){
  let h = (DATA.task ? `<div class="grp">Start here</div><a data-view="task">The task</a>` : "")
    + `<div class="grp">Your client</div><a data-view="brief">Brief</a>` + (P.profilePage ? `<a data-view="profile">Studio profile</a>` : "")
    + (P.brandPage ? `<a data-view="brand">Brand handout</a>` : "");
  P.company.forEach(r => h += `<a data-view="${r.id}">${r.id} · ${r.title}</a>`);
  if (P.dataPage) h += `<a data-view="data">Data pack (downloads)</a>`;
  h += `<div class="grp">Industry reports</div><a data-view="industry">All industry reports</a>`;
  DATA.industry.forEach(r => h += `<a data-view="${r.id}">${r.id} · ${r.title}</a>`);
  $("nav").innerHTML = h;
}
function show(v){
  view = v; let html = "";
  if (v === "brief") html = P.brief;
  else if (v === "brand") html = P.brandPage;
  else if (v === "task") html = DATA.task;
  else if (v === "profile") html = P.profilePage;
  else if (v === "data") html = P.dataPage;
  else if (v === "industry") html = DATA.industryIndex;
  else { const r = P.company.find(x => x.id === v) || DATA.industry.find(x => x.id === v); html = r ? r.html : ""; }
  $("content").innerHTML = html; $("content").scrollTop = 0;
  document.querySelectorAll("nav.side a").forEach(a => a.classList.toggle("on", a.dataset.view === v));
}
document.addEventListener("click", e => { const a = e.target.closest("[data-view]"); if (a){ e.preventDefault(); show(a.dataset.view); } });

// ---- chat: meaning-based matching, with keywords as a backup ----
const MODEL_LIB = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";
const MODEL = "Xenova/all-MiniLM-L6-v2";
const HI = 0.52, LO = 0.36;          // answer when the best match is at least HI; suggest topics above LO
let EMB = null, EX = [];
async function loadModel(){
  // Prefer the copies hosted next to this page (site/vendor and site/models); fall back to the public CDNs.
  const here = p => new URL(p, location.href).href;
  let T, local = true;
  try { T = await import(here("./vendor/transformers/transformers.min.js")); }
  catch(e){ local = false; try { T = await import(MODEL_LIB); } catch(e2){ console.warn("Model library unavailable, using keywords only", e2); if (TEST) $("typing").textContent = "Meaning model unavailable: keywords only."; return; } }
  try {
    let ext;
    if (local){
      T.env.backends.onnx.wasm.wasmPaths = here("./vendor/transformers/");
      T.env.allowLocalModels = true; T.env.allowRemoteModels = false; T.env.localModelPath = here("./models/");
      try { ext = await T.pipeline("feature-extraction", MODEL, {dtype: "q8"}); }
      catch(e){ console.warn("Local model files missing, trying Hugging Face", e); local = false; }
    }
    if (!ext){ T.env.allowLocalModels = false; T.env.allowRemoteModels = true; ext = await T.pipeline("feature-extraction", MODEL, {dtype: "q8"}); }
    const texts = [], owners = [];
    for (const it of P.script.intents) for (const e of [it.label, ...(it.examples || [])]) { texts.push(e); owners.push(it); }
    const out = await ext(texts, {pooling: "mean", normalize: true});
    const dim = out.dims[1];
    EX = texts.map((t, i) => ({it: owners[i], v: out.data.slice(i*dim, (i+1)*dim)}));
    EMB = async q => (await ext([q], {pooling: "mean", normalize: true})).data;
    if (TEST) $("typing").textContent = "Meaning model loaded (" + (local ? "from this site" : "from the public CDN") + ").";
  } catch(e){ console.warn("Model unavailable, using keywords only", e); if (TEST) $("typing").textContent = "Meaning model unavailable: keywords only."; }
}
const norm = s => " " + s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9$,.'&\- ]+/g, " ").replace(/\s+/g, " ") + " ";
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function kwRe(k){ k = k.toLowerCase().trim(); return (k.length <= 4 && /^[a-z0-9]+$/.test(k)) ? new RegExp("\\b" + esc(k) + "(s|es)?\\b") : new RegExp("(^|[^a-z0-9])" + esc(k)); }
async function scores(text){
  const res = new Map();
  if (EMB){
    const v = await EMB(text);
    for (const ex of EX){ let s = 0; for (let k = 0; k < v.length; k++) s += v[k] * ex.v[k];
      const cur = res.get(ex.it.id); if (!cur || s > cur.s) res.set(ex.it.id, {it: ex.it, s}); }
  }
  const t = norm(text);
  for (const it of P.script.intents){
    if (it.keywords.some(k => kwRe(k).test(t))){ const cur = res.get(it.id) || {it, s: 0}; cur.s = EMB ? cur.s + 0.08 : Math.max(cur.s, 0.6); res.set(it.id, cur); }
  }
  return [...res.values()].sort((a, b) => b.s - a.s);
}
function parts(q){
  let ps = q.split(/[?!.\n]+/).map(x => x.trim()).filter(x => x.split(/\s+/).length >= 2);
  if (ps.length <= 1){ const a = q.split(/\s+(?:and also|and|also|plus)\s+/i).map(x => x.trim()).filter(x => x.split(/\s+/).length >= 3); if (a.length > 1) ps = a; }
  return ps;
}
function answer(its){
  const text = its.map(it => (S.asked[it.id] ? "As I mentioned: " : "") + it.answer).join("\n\n");
  its.forEach(it => S.asked[it.id] = (S.asked[it.id] || 0) + 1);
  return text;
}
async function reply(q){
  const all = await scores(q), chosen = [];
  const ps = parts(q);
  if (ps.length > 1) for (const part of ps){ const r = await scores(part); if (r[0] && r[0].s >= HI && !chosen.includes(r[0].it)) chosen.push(r[0].it); }
  if (!chosen.length && all[0] && all[0].s >= HI){
    chosen.push(all[0].it);
    if (all[1] && all[1].s >= HI && all[0].s - all[1].s < 0.03) chosen.push(all[1].it);
  }
  const dbg = all.slice(0, 3).map(x => `${x.it.id} ${x.s.toFixed(2)}`).join(" · ") || "no match";
  if (chosen.length) return {text: answer(chosen.slice(0, 2)), dbg};
  // Not sure: offer the closest topics. Hidden topics only appear if the question came close to them.
  const near = all.filter(x => x.it.id !== "thanks" && (x.s >= LO || !x.it.hidden)).map(x => x.it);
  for (const it of P.script.intents) if (near.length < 3 && !it.hidden && it.id !== "thanks" && !near.includes(it) && !S.asked[it.id]) near.push(it);
  const chips = near.slice(0, 3).map(it => ({id: it.id, label: it.label}));
  return {text: P.script.unsure || "I'm not sure I got that. Did you mean one of these?", dbg, chips};
}
const hhmm = ts => new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
function render(m){
  const d = document.createElement("div"); d.className = "msg " + m.who;
  d.textContent = m.text;
  if (m.chips) d.insertAdjacentHTML("beforeend", '<div class="chips">' + m.chips.map(c => `<button class="chip" data-intent="${c.id}"></button>`).join("") + "</div>");
  if (m.chips) d.querySelectorAll(".chip").forEach((b, i) => b.textContent = m.chips[i].label);
  d.insertAdjacentHTML("beforeend", `<span class="t">${m.who === "agency" ? "Your agency" : P.client.name} · ${hhmm(m.ts)}</span>` + (TEST && m.dbg ? `<span class="dbg">matched: ${m.dbg}</span>` : ""));
  $("msgs").appendChild(d); $("msgs").scrollTop = 1e9;
}
function push(who, text, dbg, chips){ const m = {who, text, ts: Date.now(), dbg, chips}; S.msgs.push(m); save(); render(m); }
function save(){ const {key, ...rest} = S; store.set(S.key, rest); }
let busy = false;
async function send(text, forcedId){
  const q = (text ?? $("q").value).trim(); if (!q || busy) return;
  if (text === undefined) $("q").value = "";
  push("agency", q); busy = true; $("send").disabled = true;
  $("typing").textContent = P.client.name + " is typing…";
  let r;
  try { r = forcedId ? {text: answer([P.script.intents.find(i => i.id === forcedId)]), dbg: forcedId + " (button)"} : await reply(q); }
  catch(e){ console.error(e); r = {text: P.script.fallback[0], dbg: "error"}; }
  setTimeout(() => { $("typing").textContent = ""; push("client", r.text, r.dbg, r.chips); busy = false; $("send").disabled = false; }, 700 + Math.min(2000, r.text.length * 5));
}
$("send").onclick = () => send();
$("q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
document.addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) send(c.textContent, c.dataset.intent); });

// ---- test tools ----
$("t-reset").onclick = () => { if (confirm("Clear this group's chat and timer?")){ store.del(S.key); location.reload(); } };

// ---- toolbar ----
$("print").onclick = () => { show("brief"); setTimeout(() => window.print(), 100); };
$("dl").onclick = () => {
  const lines = S.msgs.map(m => `[${hhmm(m.ts)}] ${m.who === "agency" ? "Agency" : P.client.name}: ${m.text}`);
  const blob = new Blob([`Group ${G} · ${P.name} · chat with ${P.client.name}\n\n` + lines.join("\n\n")], {type:"text/plain"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Group${G}-${P.id}-client-chat.txt`; a.click();
};
document.addEventListener("click", async e => {
  const b = e.target.closest(".dl-asset"); if (!b) return;
  const file = b.dataset.file, base = file.replace(/\.svg$/, "");
  let svg = P.assets[file];
  // Put the brand fonts inside the file, so it looks right in Slides, PowerPoint or Canva.
  const toB64 = buf => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(s); };
  let faces = "";
  for (const [fam, w, f] of (P.fonts || [])) if (svg.includes(fam)) {
    try { faces += `@font-face{font-family:'${fam}';font-weight:${w};src:url(data:font/woff2;base64,${toB64(await (await fetch("fonts/" + f)).arrayBuffer())})}`; } catch(err){}
  }
  if (faces) svg = svg.replace(">", `><defs><style>${faces}</style></defs>`);
  const save = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };
  if (b.dataset.fmt === "svg") return save(new Blob([svg], {type: "image/svg+xml"}), `${P.id}-${base}.svg`);
  const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  await img.decode();
  const scale = Math.max(2, 1600 / img.naturalWidth), c = document.createElement("canvas");
  c.width = img.naturalWidth * scale; c.height = img.naturalHeight * scale;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(blob => save(blob, `${P.id}-${base}.png`), "image/png");
});
// data downloads (report numbers, datasets, the whole pack): the files travel inside the encrypted payload
const MIME = {xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", csv: "text/csv;charset=utf-8"};
document.addEventListener("click", e => {
  const b = e.target.closest(".dl-data"); if (!b) return;
  const name = b.dataset.file, data = (P.files || {})[name] || (DATA.files || {})[name];
  if (!data) return;
  const out = (P.files || {})[name] && !/data-pack/.test(name) ? `${P.id}-${name}` : name;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([b64(data)], {type: MIME[name.split(".").pop()]})); a.download = out; a.click();
});
$("out").onclick = () => { store.del("a5-auth"); location.reload(); };

// resume after a refresh
const saved = store.get("a5-auth");
if (saved){ $("pw").value = saved.pw; $("grp").value = saved.group; login(saved.pw, saved.group); }
